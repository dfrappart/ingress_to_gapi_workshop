apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium-gateway-class-config
  namespace: samplegw
spec:
  service:
    type: NodePort  
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-nodeport-gateway-class
spec:
  controllerName: io.cilium/gateway-controller
  description: A Cilium GatewayClass for local k8s testing with NodePort svc.
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium-gateway-class-config
    namespace: samplegw    
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gw2
  namespace: samplegw
spec:
  gatewayClassName: cilium-nodeport-gateway-class
  listeners:
  - protocol: HTTP
    port: 80
    name: test-gw2
    allowedRoutes:
      namespaces:
        from: Same     