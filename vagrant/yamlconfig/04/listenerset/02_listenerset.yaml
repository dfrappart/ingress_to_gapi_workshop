
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: gundam-listenerset
  namespace: gundam
spec:
  parentRef:
    namespace: shared-gw
    name: shared-gw-tls-listenerset
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
  - name: first
    hostname: k8ssingle3
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: gundamapp-tls
---
